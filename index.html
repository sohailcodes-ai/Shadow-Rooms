
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow Rooms: Real-Time Hangouts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');
      
      :root {
        --bg-primary: #0A0A10;
        --bg-secondary: #1a1936;
        --neon-cyan: #00f6ff;
        --neon-magenta: #ff00ff;
        --neon-green: #39ff14;
        --text-primary: #e0e0e0;
        --text-secondary: #a0a0c0;
        --font-heading: 'Space Grotesk', sans-serif;
        --font-body: 'Space Grotesk', sans-serif;
      }

      body {
        font-family: var(--font-body);
        background-color: var(--bg-primary);
        color: var(--text-primary);
        overflow: hidden;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-heading);
        font-weight: 700;
      }
      
      /* New Animated Background */
      .background-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: -1;
        overflow: hidden;
        background-color: var(--bg-primary);
      }

      .background-grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
          linear-gradient(to right, rgba(0, 246, 255, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 246, 255, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: pan-grid 120s linear infinite;
      }

      @keyframes pan-grid {
        0% { background-position: 0 0; }
        100% { background-position: 500px 500px; }
      }
      
      .glow-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.3;
      }

      .orb1 {
        width: 500px;
        height: 500px;
        background: var(--neon-cyan);
        top: -250px;
        left: -250px;
        animation: move-orb1 35s ease-in-out infinite alternate;
      }
      .orb2 {
        width: 600px;
        height: 600px;
        background: var(--neon-magenta);
        bottom: -300px;
        right: -300px;
        animation: move-orb2 40s ease-in-out infinite alternate;
      }
      .orb3 {
        width: 400px;
        height: 400px;
        background: #4f00ff;
        bottom: 10vh;
        left: 20vw;
        animation: move-orb3 30s ease-in-out infinite alternate;
      }


      @keyframes move-orb1 {
        from { transform: translate(0, 0) scale(1) rotate(0deg); }
        to { transform: translate(100px, 200px) scale(1.1) rotate(45deg); }
      }
       @keyframes move-orb2 {
        from { transform: translate(0, 0) scale(1.2) rotate(0deg); }
        to { transform: translate(-200px, -100px) scale(1) rotate(-60deg); }
      }
       @keyframes move-orb3 {
        from { transform: translate(0, 0) scale(1) rotate(0deg); }
        to { transform: translate(150px, -150px) scale(1.3) rotate(30deg); }
      }

      /* Enhanced Glass Card with Neon Glow */
      .glass-card {
        background: rgba(15, 14, 35, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
      }
      
      .glass-card:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }
      
      /* Neon UI elements */
      .neon-text {
        text-shadow: 0 0 4px var(--neon-cyan), 0 0 8px var(--neon-cyan);
      }
      
      .neon-button {
        background-color: rgba(0, 246, 255, 0.1);
        border: 1px solid rgba(0, 246, 255, 0.3);
        color: var(--neon-cyan);
        box-shadow: inset 0 0 8px rgba(0, 246, 255, 0.2), 0 0 8px rgba(0, 246, 255, 0.1);
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
      }
      
      .neon-button:hover {
        background-color: rgba(0, 246, 255, 0.2);
        box-shadow: inset 0 0 12px rgba(0, 246, 255, 0.4), 0 0 16px rgba(0, 246, 255, 0.4);
        color: white;
      }
      
      .neon-input {
        background-color: rgba(0,0,0,0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
      }
      
      .neon-input:focus {
        outline: none;
        border-color: var(--neon-cyan);
        box-shadow: 0 0 12px rgba(0, 246, 255, 0.4);
      }
      
      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--neon-magenta);
        border-radius: 4px;
        box-shadow: 0 0 5px var(--neon-magenta);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: white;
      }

    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="background-container">
      <div class="background-grid"></div>
      <div class="glow-orb orb1"></div>
      <div class="glow-orb orb2"></div>
      <div class="glow-orb orb3"></div>
    </div>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
